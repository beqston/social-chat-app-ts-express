<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/styles/login.css">
</head>
<body>
    <main>
        <div class="form-container">
            <p class="title">Forgot Password</p>
            <p class="subtitle">Enter your email and we'll send you a reset link</p>

            <form id="forgot" class="form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        placeholder="Please Enter Email"
                        required
                    >
                </div>

                <p id="error-message" class="error-message"></p>
                <p id="success-message" class="success-message"></p>

                <br/>
                <button class="sign" id="submit-btn" type="submit">
                    Send Reset Link
                </button>
            </form>

            <p class="signup">
                Remember your password?
                <a href="/login">Login</a>
                <span> Or </span>
                <a href="/register">Sign up</a>
            </p>
        </div>
    </main>

    <script>
        const form = document.getElementById('forgot');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            // Clear previous messages
            errorMsg.textContent = '';
            successMsg.textContent = '';

            // Basic validation
            if (!email) {
                errorMsg.textContent = 'Please enter your email.';
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok) {
                    // ✅ Show success then redirect to login
                    successMsg.textContent = '✅ Reset link sent! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000); 
                } else {
                    errorMsg.textContent = data.message || 'Something went wrong!';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }

            } catch (error) {
                errorMsg.textContent = 'Server error, please try again later.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>

    <style>
        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1rem;
            text-align: center;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            min-height: 1rem;
        }
        .success-message {
            color: #2ecc71;
            font-size: 0.85rem;
            min-height: 1rem;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</body>
</html>
