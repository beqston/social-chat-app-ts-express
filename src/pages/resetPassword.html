\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/styles/login.css">
</head>
<body>
    <main>
        <div class="form-container">
            <p class="title">Reset Password</p>
            <p class="subtitle">Enter your new password below</p>

            <form id="reset" class="form">
                <div class="input-group">
                    <label for="password">New Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter new password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        name="confirmPassword" 
                        id="confirmPassword" 
                        placeholder="Confirm new password"
                        required
                        minlength="8"
                    >
                </div>

                <p id="error-message" class="error-message"></p>
                <p id="success-message" class="success-message"></p>

                <br/>
                <button type="submit" class="sign" id="submit-btn">
                    Change Password
                </button>
                <br/>

                <p class="signup">
                    Remember your password?
                    <a href="/login">Login</a>
                    <span> Or </span>
                    <a href="/register">Sign up</a>
                </p>
            </form>
        </div>
    </main>

    <script>
        const form        = document.getElementById('reset');
        const errorMsg    = document.getElementById('error-message');
        const successMsg  = document.getElementById('success-message');
        const submitBtn   = document.getElementById('submit-btn');

        // ─── Helper Functions ─────────────────────────
        const showError = (msg) => {
            errorMsg.textContent = msg;
            successMsg.textContent = '';
        };

        const showSuccess = (msg) => {
            successMsg.textContent = msg;
            errorMsg.textContent = '';
        };

        const setLoading = (loading) => {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Changing...' : 'Change Password';
        };

        const clearMessages = () => {
            errorMsg.textContent = '';
            successMsg.textContent = '';
        };

        // ─── Validate ─────────────────────────────────
        const validate = (password, confirmPassword) => {
            if (!password || !confirmPassword) {
                return 'Please fill in all fields.';
            }
            if (password.length < 8) {
                return 'Password must be at least 8 characters.';
            }
            if (password !== confirmPassword) {
                return 'Passwords do not match.';
            }
            return null; // no error
        };

        // ─── Submit ───────────────────────────────────
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const password        = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            // Validate
            const validationError = validate(password, confirmPassword);
            if (validationError) {
                showError(validationError);
                return;
            }

            // Get token from URL → /reset-password/:token
            const token = window.location.pathname.split('/').pop();
            if (!token) {
                showError('Invalid or missing reset token.');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch(`/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })  // ✅ only send password
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.msg || 'Something went wrong.');
                    setLoading(false);
                    return;
                }

                // ✅ Success → redirect to login
                showSuccess('✅ Password changed! Redirecting to login...');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);

            } catch (error) {
                showError('Server error, please try again later.');
                setLoading(false);
            }
        });
    </script>

    <style>
        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1rem;
            text-align: center;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            min-height: 1rem;
            margin-top: 8px;
        }
        .success-message {
            color: #2ecc71;
            font-size: 0.85rem;
            min-height: 1rem;
            margin-top: 8px;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</body>
</html>
