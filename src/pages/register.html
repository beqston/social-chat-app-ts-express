<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/register.css">
</head>
<body>

    <div class="form-container">
        <form class="form" action="/add-user" method="POST">
            <span class="heading">Registration Form</span>
            
            <div class="form-group">
                <input class="form-input" name="username" required="" type="text" />
                <label>Username</label>
            </div>

            <div class="form-group">
                <input class="form-input" name="email" required="" type="email" />
                <label>Email</label>
            </div>

            <div class="form-group">
                <input class="form-input" name="password" required="" type="password" />
                <label>Password</label>
            </div>

            <div class="form-group">
                <input class="form-input" name="confirmPassword" required="" type="password" />
                <label>Confirm Password</label>
            </div>

            <button>Register</button>
        </form>
    </div>

</body>
</html>
