<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="styles/register.css">
</head>
<body>
    <main>
        <!-- Toast Modal For Notification -->
        <div id="toast-modal"></div>

        <!-- form container -->
        <div class="form-container">
            
            <form id="sign-up" class="form">
                <span class="heading">Registration Form</span>
                
                <div class="form-group">
                    <input class="form-input" name="username" id="username" required type="text" />
                    <label>Username</label>
                </div>

                <div class="form-group">
                    <input class="form-input" name="email" id="email" required type="email" />
                    <label>Email</label>
                </div>

                <div class="form-group">
                    <input class="form-input" name="password" id="password" required type="password" />
                    <label>Password</label>
                </div>

                <div class="form-group">
                    <input class="form-input" name="confirmPassword" id="confirmPassword" required type="password" />
                    <label>Confirm Password</label>
                </div>

                <button type="submit">Register</button>
            </form>
        </div>
    </main>

    <script src="/js/signUp.js"></script>
</body>
</html>
