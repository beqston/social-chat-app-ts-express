<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Page</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/styles/messages.css">
    <link rel="stylesheet" href="/styles/header.css">
</head>
<body>
    <main id="messages-cnt">
        <aside id="message-aside">
            <div id="messages"></div>
        </aside>
        <div id="pm-messages">
            <a id="back-mobile" href="/messages"><img src="/images/message/back-arrow.png" alt=""></a>
            <p id="active-time"></p>
            <div id="all-messages"></div>
            <p id="typing-status"></p>
            <form id="send-message-form" method="POST">
                <input type="hidden" id="remove-chat-id">
                <input type="hidden" id="edit-message-id" value="">
                <textarea name="message" id="message"></textarea>
                <button id="send-btn">Send Message</button>
            </form>
        </div>
       
    </main>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/header.js"></script>    
<script type="module" src="/js/message.js"></script>   
<script type="module" src="/js/messages.js"></script>   
</body>
</html>
