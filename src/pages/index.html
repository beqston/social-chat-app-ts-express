<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/home.css">
</head>
<body>
    <main id="content-area">

        <section id="create-post-wrapper">
            <form id="post-cnt" action="/add-post" enctype="multipart/form-data" method="POST">
                <textarea name="text" id="text" placeholder="What's on your mind?"></textarea>

                <div id="preview-wrapper" style="display: none;">
                    <img id="show-image-previw" src="" alt="Selected Image">
                    <div id="remove-img-btn">&times;</div>
                </div>
                
                <div id="post-actions">
                    <div id="upload-cnt">
                        <label for="image">
                            <img src="/images/home/upload.png" alt="Upload Image">
                            <span>Add Photo</span>
                        </label>
                        <input type="file" name="image" id="image" accept="image/*" />
                    </div>
                    <button type="submit" id="post-btn">Post</button>
                </div>
            </form>
        </section>

        <section id="posts-container"></section>

        <section id="edit-post">
            <form id="post-edit-cnt">
                <textarea name="text" id="newText" placeholder="What's on your mind?"></textarea>

                <div id="preview-edit-wrapper" style="display: none;">
                    <img id="show-edit-image-previw" src="" alt="Selected Image">
                    <div id="remove-edit-img-btn">&times;</div>
                </div>
                
                <div id="post-edit-actions">
                    <div id="upload-edit-cnt">
                        <label for="image">
                            <img src="/images/home/upload.png" alt="Upload Image">
                            <span>Add Photo</span>
                        </label>
                        <input type="file" name="image" id="newImage" accept="image/*" />
                    </div>
                    <button type="submit" id="post-edit-btn">Post</button>
                </div>
            </form>
        </section>
        <div id="delete-window-wrapper">
            <div id="delete-post-alert">
                <p>Are you sure, do you want delete post?</p>
                <div id="post-delete-wrapper"> 
                    <button class="close">No</button>
                    <button class="delete">Yes</button>
                </div>
            </div>
        </div>

        <div id="message-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
            <p id="status-message" style="display: none; padding: 10px; border-radius: 5px; color: white; font-weight: bold;"></p>
        </div>
    </main>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/header.js"></script>
<script type="module" src="/js/home.js"></script>

</body>
</html>
